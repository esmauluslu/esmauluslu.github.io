<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Annotator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #adobe-dc-view {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="loading">PDF yükleniyor...</div>
    <div id="adobe-dc-view"></div>
    
    <script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
    <script type="text/javascript">
        // Adobe SDK'nın yüklenmesini bekle
        if (window.AdobeDC) {
            initViewer();
        } else {
            document.addEventListener("adobe_dc_view_sdk.ready", initViewer);
        }
        
        function initViewer() {
            document.getElementById('loading').style.display = 'none';
            
            var adobeDCView = new AdobeDC.View({
                clientId: "d94ed46238654231b862219c1c6d8c0e",
                divId: "adobe-dc-view"
            });
            
            // PDF URL'ini kontrol edin - repository adınıza göre güncelleyin
            const pdfUrl = "https://esmauluslu.github.io/risetest/hrtoolkit.pdf";
            
            adobeDCView.previewFile({
                content: {
                    location: {
                        url: pdfUrl
                    }
                },
                metaData: {
                    fileName: "HR Toolkit.pdf"
                }
            }, {
                embedMode: "FULL_WINDOW",
                showDownloadPDF: true,
                showPrintPDF: true,
                showAnnotationTools: true,
                enableAnnotationAPIs: true,
                includePDFAnnotations: true,
                showLeftHandPanel: true,
                showPageControls: true
            }).catch(error => {
                console.error("PDF yükleme hatası:", error);
                document.getElementById('loading').innerHTML = "PDF yüklenemedi. Hata: " + error.message;
                document.getElementById('loading').style.display = 'block';
            });
        }
    </script>
</body>
</html>
